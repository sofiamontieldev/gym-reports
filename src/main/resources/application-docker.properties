gym.integrations.mongodb.enabled=true
gym.integrations.activemq.enabled=${GYM_INTEGRATIONS_ACTIVEMQ_ENABLED:true}

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

spring.jms.listener.concurrency=1
spring.jms.listener.max-concurrency=1

management.health.mongo.enabled=true
management.health.jms.enabled=${GYM_INTEGRATIONS_ACTIVEMQ_ENABLED:true}
